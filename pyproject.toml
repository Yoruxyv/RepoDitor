[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-save-editor"
version = "0.2.0"
description = "A desktop save editor for R.E.P.O. .es3 save files."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hans Valerie"}
]
dependencies = [
    "cryptography>=43,<46",
]
keywords = ["repo", "save-editor", "es3", "unity", "easy-save-3"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests"]
extend-exclude = [
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "PERF",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["repo_save_editor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
platform = "win32"
mypy_path = "python"
files = ["python/repo_save_editor"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
show_error_codes = true
show_error_context = true
pretty = true

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff>=0.16.1",
]
test = [
    "pytest>=8.3,<9",
]
package = [
    "pyinstaller>=6,<7",
]
