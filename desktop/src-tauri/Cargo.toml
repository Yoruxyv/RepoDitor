[package]
name = "repoditor-preview"
version = "0.2.1"
edition = "2021"
publish = false

[features]
native-ui-test = []
synthetic-health-recovery = []
synthetic-health-ui = ["synthetic-health-recovery"]

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
uuid = { version = "=1.29.0", features = ["v4"] }
base64 = "=0.23.1"
png = "=0.18.1"
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
