name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python static quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --locked --group test

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked test dependencies
        run: uv sync --locked --no-dev --group test

      - name: Run tests
        run: uv run --locked --no-dev --group test pytest

  desktop-quality:
    name: Desktop quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Check renderer imports
        run: npm run imports:check

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Check release version alignment
        run: npm run release:check

      - name: Build desktop
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Component and contract tests
        run: npm test

  windows-e2e:
    name: Windows Electron E2E
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked Python and packaging dependencies
        working-directory: .
        run: uv sync --locked --group package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Electron E2E
        run: npm run test:e2e

      - name: Upload Electron E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  package-smoke:
    name: Windows package smoke
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked Python and packaging dependencies
        working-directory: .
        run: uv sync --locked --group package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Build Python sidecar
        run: npm run build:sidecar

      - name: Build Electron application
        run: npm run build

      - name: Package unpacked application
        run: npm run package:dir

      - name: Packaged Electron E2E
        run: npm run test:e2e:packaged

      - name: Upload package smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  windows-tauri-safety:
    name: Windows Tauri save safety
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked test and packaging dependencies
        working-directory: .
        run: uv sync --locked --group test --group package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install validated Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Cache Rust dependencies and builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Ensure WebView2 test runtime
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $installed = @($keys | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object {
            (Get-ItemProperty -LiteralPath $_ -Name pv).pv
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($installed.Count -eq 0) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'WebView2 bootstrapper signature is invalid.'
            }
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "WebView2 setup failed: $($installer.ExitCode)" }
          }

      - name: Windows Python, Rust, artifact and native safety gate
        run: npm run test:tauri-safety

      - name: Preserve safety diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-safety-diagnostics
          path: |
            desktop/build/tauri-safety/validation.log
            desktop/build/tauri-safety/probe-transport.json
            desktop/build/tauri-safety/python.xml
            desktop/build/tauri-safety/native.json
            desktop/build/tauri-safety/startup.json
            desktop/build/tauri-safety/artifact-tests/**/artifact-check.json
            desktop/build/recovery-checkpoint/tauri-safety/**/trace.zip
            desktop/build/recovery-checkpoint/tauri-safety/**/test-failed-*.png
            desktop/build/recovery-checkpoint/tauri-safety/**/error-context.md
            desktop/build/recovery-checkpoint/tauri-safety/**/phase.json
            desktop/build/recovery-checkpoint/tauri-safety/**/startup-*.json
            desktop/build/recovery-checkpoint/tauri-safety/**/.*.health-*.json
            desktop/build/recovery-checkpoint/tauri-safety/**/*.receipt.tmp
            desktop/build/recovery-checkpoint/tauri-safety/**/*.bak-health-*
            desktop/build/recovery-checkpoint/tauri-safety/**/AppData/LocalLow/**/saves/**/*.es3
            "!desktop/build/recovery-checkpoint/tauri-safety/**/backend/**"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    needs:
      [
        python-quality,
        python-tests,
        desktop-quality,
        windows-e2e,
        package-smoke,
        windows-tauri-safety,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify quality checks
        run: |
          if [ "${{ needs.python-quality.result }}" != "success" ]; then
            echo "Python static quality failed."
            exit 1
          fi

          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "Python runtime compatibility tests failed."
            exit 1
          fi

          if [ "${{ needs.desktop-quality.result }}" != "success" ]; then
            echo "Desktop quality failed."
            exit 1
          fi

          if [ "${{ needs.windows-e2e.result }}" != "success" ]; then
            echo "Windows Electron E2E failed."
            exit 1
          fi

          if [ "${{ needs.package-smoke.result }}" != "success" ]; then
            echo "Windows package smoke failed."
            exit 1
          fi

          if [ "${{ needs.windows-tauri-safety.result }}" != "success" ]; then
            echo "Windows Tauri save safety failed."
            exit 1
          fi

          echo "All quality checks passed."
