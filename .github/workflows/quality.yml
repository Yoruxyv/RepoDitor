name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check python tests

      - name: Ruff format check
        run: uv run ruff format --check python tests

      - name: Run tests
        run: uv run --with "pytest>=8.3,<9" pytest

  desktop-quality:
    name: Desktop quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Check renderer imports
        run: npm run imports:check

      - name: ESLint
        run: npm run lint

      - name: Build desktop
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Component and contract tests
        run: npm test

  windows-integration:
    name: Windows integration
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked Python and packaging dependencies
        working-directory: .
        run: uv sync --locked --group package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Electron E2E
        run: npm run test:e2e

      - name: Build Python sidecar
        run: npm run build:sidecar

      - name: Build Electron application
        run: npm run build

      - name: Package unpacked application
        run: npm run package:dir

      - name: Packaged Electron E2E
        run: npm run test:e2e:packaged

  quality-gate:
    name: Quality gate
    needs: [quality, desktop-quality, windows-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify quality checks
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality checks failed."
            exit 1
          fi

          if [ "${{ needs.desktop-quality.result }}" != "success" ]; then
            echo "Desktop quality failed."
            exit 1
          fi

          if [ "${{ needs.windows-integration.result }}" != "success" ]; then
            echo "Windows integration failed."
            exit 1
          fi

          echo "All quality checks passed."
