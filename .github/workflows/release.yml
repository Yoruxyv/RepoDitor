name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VALIDATE to authorize a Windows build and checksum check
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize-validation:
    name: Authorize release validation
    runs-on: ubuntu-latest
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$CONFIRM" != VALIDATE ]]; then
            echo 'Run from main with confirm=VALIDATE.'
            exit 1
          fi
  validate:
    name: Validate Windows binaries and installer
    needs: authorize-validation
    uses: ./.github/workflows/installer-lifecycle.yml
