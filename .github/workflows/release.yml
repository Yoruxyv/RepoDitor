name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked Python and packaging dependencies
        run: uv sync --locked --group package

      - name: Python quality and tests
        run: |
          uv run ruff check python tests
          uv run ruff format --check python tests
          uv run --with "pytest>=8.3,<9" pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Desktop quality and tests
        working-directory: desktop
        run: |
          npm run imports:check
          npm run lint
          npm run release:check
          npm test

      - name: Build Python sidecar
        working-directory: desktop
        run: npm run build:sidecar

      - name: Build Electron application
        working-directory: desktop
        run: npm run build

      - name: Check renderer bundle budget
        working-directory: desktop
        run: npm run bundle:check

      - name: Package unpacked application
        working-directory: desktop
        run: npm run package:dir

      - name: Run packaged smoke test
        working-directory: desktop
        run: npm run test:e2e:packaged

      - name: Upload packaged smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify Windows installer
        working-directory: desktop
        run: npm run package:installer

      - name: Create installer checksum
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = Get-Item release/RepoDitor-Setup-*-x64.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoDitor-windows
          path: |
            desktop/release/RepoDitor-Setup-*-x64.exe
            desktop/release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/RepoDitor-Setup-*-x64.exe
            desktop/release/*.sha256
          generate_release_notes: true
