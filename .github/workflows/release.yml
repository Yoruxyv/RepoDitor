name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Build RepoDitor.exe
        run: >-
          uv run --with pyinstaller
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name RepoDitor
          --paths src
          src/repo_save_editor/__main__.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoDitor-windows
          path: dist/RepoDitor.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RepoDitor.exe
          generate_release_notes: true
