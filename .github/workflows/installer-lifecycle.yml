name: Installer lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  current-user-lifecycle:
    name: Current-user Tauri installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync locked packaging dependencies
        working-directory: .
        run: uv sync --locked --group package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Verify versions and retained installer host
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run release:check
          npm run test:installer:host
          npm run test:installer:layout
          npm run installer:host
          npm run installer:verify:host
      - name: Verify installer supervision failure paths
        run: ./installer/scripts/test-installer-lifecycle-process.ps1
      - name: Verify installer UI diagnostics and action eligibility
        shell: powershell
        run: ./installer/scripts/test-installer-lifecycle-ui.ps1
      - name: Build and verify the production NSIS installer and portable payload
        run: npm run package:installer
      - name: Fetch published v0.2.1 for migration
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item -LiteralPath "build/installer/RepoDitor-Setup-$version-x64.exe"
          $legacy = Join-Path $env:RUNNER_TEMP 'RepoDitor-Setup-0.2.1-x64.exe'
          Invoke-WebRequest 'https://github.com/Yoruxyv/RepoDitor/releases/download/v0.2.1/RepoDitor-Setup-0.2.1-x64.exe' -OutFile $legacy
          "REPODITOR_CI_SETUP=$($setup.FullName)" >> $env:GITHUB_ENV
          "REPODITOR_LEGACY_SETUP=$legacy" >> $env:GITHUB_ENV
      - name: Build test-only public-editing UI host (never packaged)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $config = Get-Content -LiteralPath 'build/release-installer/public-editing.json' -Raw | ConvertFrom-Json
          $browser = Get-Content -LiteralPath 'src-tauri/startup.test.conf.json' -Raw | ConvertFrom-Json
          $config.app | Add-Member -NotePropertyName windows -NotePropertyValue $browser.app.windows -Force
          $previousTauriConfig = $env:TAURI_CONFIG
          try {
            $env:TAURI_CONFIG = $config | ConvertTo-Json -Depth 12 -Compress
            cargo build --manifest-path src-tauri/Cargo.toml --release --locked --features tauri/custom-protocol,public-editing,native-ui-test
          } finally {
            $env:TAURI_CONFIG = $previousTauriConfig
          }
          $uiHostDir = Join-Path (Get-Location) 'build/test-only-public-editing-ui-host'
          Remove-Item -LiteralPath $uiHostDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $uiHostDir | Out-Null
          $uiHostExe = Join-Path $uiHostDir 'repoditor-preview.exe'
          Copy-Item -LiteralPath 'src-tauri/target/release/repoditor-preview.exe' -Destination $uiHostExe -Force
          $backendTarget = (Resolve-Path -LiteralPath 'build/tauri-release/backend').Path
          New-Item -ItemType Junction -Path (Join-Path $uiHostDir 'backend') -Target $backendTarget | Out-Null
          $artifact = Get-Content -LiteralPath 'build/tauri-release/artifact-check.json' -Raw | ConvertFrom-Json
          $actualProdHash = (Get-FileHash -LiteralPath 'build/tauri-release/RepoDitor.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualProdHash -ne $artifact.hostSha256) {
            throw 'Production portable host hash changed while building the test-only UI host.'
          }
          "REPODITOR_E2E_UI_EXECUTABLE=$uiHostExe" >> $env:GITHUB_ENV
      - name: Install, launch WebView2, uninstall and verify synthetic game data
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:REPODITOR_NATIVE_BROWSER_ARGS = '1'
          npm run typecheck:e2e
          npm exec -- playwright test e2e/installer/tauri-installer.spec.ts --output=test-results/tauri-installer --retries=0
      - name: Retain checksums and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-diagnostics
          path: |
            desktop/build/tauri-release/artifact-check.json
            desktop/build/installer/*.sha256
            desktop/test-results/tauri-installer/**/*.png
            desktop/test-results/tauri-installer/**/trace.zip
            desktop/test-results/tauri-installer/**/error-context.md
            desktop/test-results/tauri-installer/**/startup-*.json
          if-no-files-found: warn
          retention-days: 14
